<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3ece3">
  <meta name="description" content="上传花边图片，按纹理和图案找出最相似的蕾丝样品。忽略颜色，并自动跳过顶部文字。">
  <title>花边寻纹 · 蕾丝样品检索</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <p class="spine">Lace Pattern Index</p>
  <div class="wrap">
    <header class="header">
      <a class="brand" href="index.html">
        <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="16" fill="#f7f1e8"/>
          <g fill="#8d4540">
            <ellipse cx="32" cy="18" rx="5" ry="10"/>
            <ellipse cx="32" cy="46" rx="5" ry="10"/>
            <ellipse cx="18" cy="32" rx="10" ry="5"/>
            <ellipse cx="46" cy="32" rx="10" ry="5"/>
          </g>
          <circle cx="32" cy="32" r="5" fill="#f7f1e8"/>
          <circle cx="32" cy="32" r="2.6" fill="#9c7848"/>
        </svg>
        <span>
          <strong class="brand-name">花边寻纹</strong>
          <small class="brand-sub">蕾丝样品检索</small>
        </span>
      </a>
      <div class="header-actions">
        <p class="lib-chip">
          <strong id="libCount">正在读取样品库</strong>
          <span id="libMeta"></span>
        </p>
        <button id="reload" class="btn btn-ghost" type="button">刷新样品库</button>
        <a class="btn btn-ghost" href="admin.html">管理样品</a>
      </div>
    </header>

    <section class="hero">
      <p class="eyebrow">Texture Archive</p>
      <h1>花边寻纹</h1>
      <p class="lede">上传一片蕾丝，从云端样品库里找出花纹最接近的布料。颜色会被放下，只留下纹理与图案。</p>
    </section>

    <section class="stage" aria-label="上传并检索">
      <div id="dropzone" class="dropzone">
        <input id="file" type="file" accept="image/jpeg,image/png,.jpg,.jpeg,.png" hidden>
        <svg class="drop-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <rect x="7" y="9" width="34" height="30" rx="6" stroke="currentColor" stroke-width="1.6"/>
          <path d="M24 28V16M24 16l-5 5M24 16l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h2>把花边拖到这里</h2>
        <p>支持 JPG、PNG。将自动忽略顶部文字，只比对花纹。</p>
        <button id="browse" class="btn btn-primary" type="button">选择图片</button>
      </div>

      <div id="preview" class="preview" hidden>
        <div class="frame">
          <img id="previewImg" alt="待检索的花边">
          <div class="crop-mask">顶部文字已忽略</div>
        </div>
        <div class="panel">
          <p class="eyebrow">待检索</p>
          <p id="fileName" class="file-name"></p>
          <p class="note">只比对花纹的纹理和形状。颜色不同，也不会被当成另一种图案。局部截取的一小块重复花纹，也可以对上完整样品。</p>
          <label class="slider" for="count"><span>显示数量</span><strong id="countVal">10</strong></label>
          <input id="count" type="range" min="5" max="20" step="1" value="10" aria-label="显示数量">
          <label class="slider" for="threshold"><span>最低相似度</span><strong id="thresholdVal">50%</strong></label>
          <input id="threshold" type="range" min="0" max="100" step="1" value="50" aria-label="最低相似度">
          <button id="search" class="btn btn-primary" type="button">寻找相似花纹</button>
          <button id="clear" class="btn btn-ghost" type="button">更换图片</button>
        </div>
      </div>
    </section>

    <section class="results" aria-live="polite">
      <div class="results-head">
        <h2 id="resultsTitle">等待一张花边</h2>
        <p id="resultsHint">放入图片后，会按花纹相似度排出最接近的样品。</p>
      </div>
      <div id="grid" class="grid"></div>
    </section>

    <footer class="footer">
      <p>比对前会裁去顶部约 15% 的文字区域，并转成纹理结构。样品图片和索引都保存在云端。</p>
    </footer>
  </div>

  <dialog id="viewer" class="viewer">
    <img id="viewerImg" alt="">
    <h3 id="viewerName"></h3>
    <p id="viewerScore"></p>
    <button id="viewerClose" class="btn btn-ghost" type="button">关闭</button>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/features.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/image.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
